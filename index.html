<body>
<div id="shell">
  <header><button class="gear" data-a="gear" aria-label="Backup and data">⚙</button><button class="gear inst" id="ib" data-a="inst" hidden>Install app</button><small id="sub"></small><h1 id="ttl"></h1><small id="cnt"></small><div class="bar" id="bar"><i></i></div></header>
  <main id="app"></main>
</div>
<nav><div id="nav"></div></nav>
<div id="mod"><div id="mc"></div></div>
<div id="toast"></div>
<script>
const TABS=[['todo','✔','To-Do'],['sess','⏱️','Sessions'],['habits','🔁','Habits'],['goals','🎯','Goals'],['quotes','❝','Quotes'],['hist','📅','History']];
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SEC={td:['TODAY','var(--p)'],cf:['CARRIED FORWARD','var(--or)'],on:['ONGOING','var(--gr)'],dn:['DONE','var(--mu)'],up:['UPCOMING','var(--bl)']};
let todos=[],tab='todo',month=new Date(),sel=null;
try{todos=JSON.parse(localStorage.getItem('mybook.todos')||'[]')}catch(e){}
let ds=[];try{ds=JSON.parse(localStorage.getItem('mybook.sessions')||'[]')}catch(e){}
let hb={cols:[],data:{}},hv='day',hday=null,hm=new Date();try{const r=JSON.parse(localStorage.getItem('mybook.habits')||'null');if(r&&Array.isArray(r.cols))hb=r}catch(e){}
let gl=[],gv='active',gcur=null;try{const r=JSON.parse(localStorage.getItem('mybook.goals')||'[]');if(Array.isArray(r))gl=r}catch(e){}
let ql=[],qv='swipe',qi=0,im={};
try{const r=JSON.parse(localStorage.getItem('mybook.quotes')||'[]');if(Array.isArray(r))ql=r}catch(e){}
let imReady=false;
const save=()=>{try{localStorage.setItem('mybook.todos',JSON.stringify(todos));localStorage.setItem('mybook.sessions',JSON.stringify(ds));localStorage.setItem('mybook.habits',JSON.stringify(hb));localStorage.setItem('mybook.goals',JSON.stringify(gl));localStorage.setItem('mybook.quotes',JSON.stringify(ql))}catch(e){}};
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt=k=>{const p=k.split('-');return(+p[2])+' '+MF[p[1]-1]+' '+p[0]};
const fd=k=>{const p=k.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const tm=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function chime(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[660,880].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);const s=c.currentTime+i*.12;g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+.35);o.start(s);o.stop(s+.35)})}catch(e){}}

function card(t,s,rm,dn){
  const cl=t.closed,dis=cl||s==='up';
  const cls=['card',s==='cf'?'cf':s==='on'?'on':s==='up'?'up':'',cl?'cl':'',isRun(t)?'rn':''].join(' ');
  const due=cl?'':`<label class="due">${ico} ${t.due?'Due '+rel(t.due):'Set due date'}<input type="date" data-a="due" data-id="${t.id}" value="${t.due||''}"></label>`;
  const h=`<div class="${cls}" data-a="open" data-id="${t.id}">
  <button class="chk ${t.done?'on':''}" data-a="tog" data-id="${t.id}" ${dis?'disabled':''}>${t.done?'✓':''}</button>
  <div class="bd"><div class="tt ${t.done?'dn':''}">${esc(t.title)}</div>${t.details?'<div class="gt" style="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.details)+'</div>':''}
  <div class="mt">${!cl&&!(t.created===dk()&&t.due===dk())?`<span>From ${fmt(t.created)}</span>`:''}${due}${t.appr?`<span class="ok">Approved ${fmt(t.appr)}</span>`:''}${t.done&&t.comp?`<span class="fin">Done ${fmt(t.comp)}</span>`:''}${cl?'<span>Closed '+(t.clo?fmt(t.clo):'')+'</span>':''}${!cl&&t.rec?'<span>Recovered '+fmt(t.rec)+'</span>':''}${sessMeta(t)}</div></div>
  ${s==='up'&&!cl?`<button class="btn" data-a="apr" data-id="${t.id}">Approve</button>`:''}
  ${cl?`<button class="btn rc" data-a="rec" data-id="${t.id}">Recover</button>`:''}${rm?`<button class="btn rc" data-a="hide" data-id="${t.id}">Remove</button>`:''}${cl?'':'<button class="grip" aria-label="Drag to reorder">⋮⋮</button>'}</div>`;
  return `<div class="dr" data-dr="t:${s}${dn?'d':''}" data-id="${t.id}">`+(cl?h:`<div class="sw">${h}</div>`)+'</div>';
}
function groups(list,day,todo){
  const dh=t=>t.done&&!t.closed&&t.comp===day;
  return ['td','cf','on','up','dn'].map(s=>{
    let a,c=[];
    if(s==='dn')a=list.filter(t=>dh(t)&&!(todo&&t.hid));
    else{a=list.filter(t=>!t.closed&&sec(t,day)===s&&!dh(t)&&!(todo&&t.done));c=list.filter(t=>t.closed&&sec(t,day)===s)}
    if(!a.length&&!c.length)return'';
    const lab=`<div class="sl" style="color:${SEC[s][1]}">${SEC[s][0]}${s==='dn'&&todo?' <button class="x" data-a="clrd" style="font-size:11px;margin-left:8px">Clear all</button>':''}</div>`;
    return lab+[...a,...c].map(t=>card(t,s==='dn'?sec(t,day):s,s==='dn'&&todo,s==='dn')).join('');
  }).join('');
}

    app.innerHTML=searchBar()+'<div id="hcal"'+(hq?' hidden':'')+'>'+`<div class="hist"><div><div class="mh"><button data-a="pm">‹</button><span>${new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span><button data-a="nm">›</button></div><div class="cal">${cells}</div><div class="lg"><span><i style="background:var(--p)"></i>To-Do</span><span><i style="background:var(--gr)"></i>Habits</span><span><i style="background:#ba7517"></i>Goals</span><span><i style="background:#d4537e"></i>Sessions</span></div></div><div>`+det+'</div></div></div><div id="hres">'+(hq?searchHtml():'')+'</div>';
  }else{
    if(tab==='sess'){sessView();return}

}

function applyImport(txt){

  if(!arr)return msg('No tasks found in this backup.');
  const list=arr.map(clean).filter(Boolean);

  const rep=document.getElementById('rp').checked;
  let n=list.length;

  return `<div class="hw"><div class="hwh"><b>Last 7 days</b><button data-a="hwall">Open history ›</button></div><div class="hwd">${days.map(d=>{
    const k=dk(d),done=todos.filter(t=>t.done&&t.comp===k).length;
    const dots=[[todos.some(t=>t.created===k||t.comp===k),'var(--p)'],[sessionsOn(k).length||dsOn(k).length,'#d4537e'],[!!hb.data[k],'var(--gr)'],[goalEv(k),'#ba7517']].filter(x=>x[0]).map(x=>`<i style="background:${x[1]}"></i>`).join('');
    return `<div class="hwc ${k===today?'t':''}" data-a="hwd" data-k="${k}"><small>${'SMTWTFS'[d.getDay()]}</small><b>${d.getDate()}</b><div class="dots">${dots}</div><em>${done?done+' done':''}</em></div>`}).join('')}</div></div>`;
}
